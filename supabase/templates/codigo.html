<div style="background:#0a0a0a;padding:40px 24px;font-family:Arial,Helvetica,sans-serif;color:#f4f4f2">
  <div style="max-width:440px;margin:0 auto">
    <!-- logo em PNG (e-mail não mostra SVG); troque o endereço quando o site mudar de domínio -->

    <p style="font-size:16px;line-height:1.5;margin:0 0 20px">Seu código para entrar na área do cliente:</p>
    <p style="font-size:36px;letter-spacing:10px;font-weight:bold;margin:0 0 24px;color:#ffffff">{{ .Token }}</p>
    <p style="font-size:14px;line-height:1.5;color:#9b9b9b;margin:0">Ele vale por alguns minutos. Se não foi você quem pediu, é só ignorar este e-mail.</p>
  </div>
</div>
